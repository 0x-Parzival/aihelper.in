server {
    server_name aihelper.in www.aihelper.in;

    client_max_body_size 32k;

    # The application serves its own public assets. Never allow its working
    # directory, source, SQLite databases, or environment files to be fetched.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(?:db|sqlite|sqlite3|py|pyc|mjs|map|log|bak|swp)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' wss://streaming.assemblyai.com; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none'; frame-src https://spiritual-face.keshavbruh.workers.dev; form-action 'self'; img-src 'self' data: https://cdn.shopify.com; media-src 'self' data:; object-src 'none'; script-src 'self' 'sha256-0jYl88rxgyaprBrZFOhag96tc6VDNZaZK98xk07PWuM='; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com" always;

    location = /twilio/stream {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600;
    }

    location = /plivo/stream {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600;
    }

    location = /telnyx/stream {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600;
    }

    location ^~ /auth/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/aihelper.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aihelper.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.aihelper.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = aihelper.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name aihelper.in www.aihelper.in;
    return 404; # managed by Certbot




}
